<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalle del producto | Pastelería Mil Sabores</title>

    <link rel="stylesheet" href="../assets/css/styles.css">
</head>

<body>

    <!-- encabezado y navegación -->
    <header class="site-header">

        <a href="../index.html" class="logo">
            <img
                src="../assets/img/logo-pasteleria.png"
                alt="Pastelería Mil Sabores"
            >
        </a>

        <nav>
            <a href="../index.html">Inicio</a>
            <a href="Productos.html">Productos</a>
            <a href="Carrito.html">Carrito</a>
            <a href="RegistroUsuario.html">Registrarse</a>
            <a href="IniciarSesion.html">Iniciar sesión</a>
            <a href="blogs.html">Blog</a>
            <a href="contacto.html">Contacto</a>
            <a href="nosotros.html">Nosotros</a>
        </nav>

    </header>

    <!-- contenido principal -->
    <main>

        <section class="detalle-container">

            <!-- detalle del producto -->
            <article
                id="detalleProducto"
                class="detalle-producto"
            >

                <!-- imagen del producto -->
                <div class="detalle-imagen">

                    <img
                        id="imagenProducto"
                        src="../assets/img/producto-placeholder.jpg"
                        alt="Imagen del producto"
                    >

                </div>

                <!-- información del producto -->
                <div class="detalle-info">

                    <p
                        id="categoriaProducto"
                        class="detalle-categoria"
                    >
                        Producto de repostería
                    </p>

                    <h1 id="nombreProducto">
                        Detalle del producto
                    </h1>

                    <p
                        id="descripcionProducto"
                        class="detalle-descripcion"
                    >
                        Selecciona un producto para conocer todos sus detalles.
                    </p>

                    <p
                        id="precioProducto"
                        class="detalle-precio"
                    >
                        $0
                    </p>

                    <!-- personalización -->
                    <div class="form-group">

                        <label for="mensajePersonalizado">
                            Mensaje para personalizar
                        </label>

                        <textarea
                            id="mensajePersonalizado"
                            name="mensajePersonalizado"
                            placeholder="Escribe un mensaje para tu producto"
                            maxlength="100"
                            rows="4"
                        ></textarea>

                        <small id="errorMensajePersonalizado"></small>

                    </div>

                    <!-- cantidad -->
                    <div class="form-group">

                        <label for="cantidadProducto">
                            Cantidad
                        </label>

                        <input
                            type="number"
                            id="cantidadProducto"
                            name="cantidadProducto"
                            value="1"
                            min="1"
                            max="5"
                        >

                        <small id="errorCantidadProducto"></small>

                    </div>

                    <!-- botón para agregar al carrito -->
                    <button
                        type="button"
                        id="btnAgregarCarrito"
                    >
                        Añadir al carrito
                    </button>

                    <!-- volver al catálogo -->
                    <a
                        href="Productos.html"
                        class="volver-productos"
                    >
                        Volver a productos
                    </a>

                </div>

            </article>

            <!-- mensaje general -->
            <p
                id="mensajeDetalle"
                class="mensaje-detalle"
            ></p>

        </section>

    </main>

    <!-- pie de página -->
    <footer>

        <p>
            &copy; 2026 Pastelería Mil Sabores.
            Todos los derechos reservados.
        </p>

    </footer>

</body>

</html>
