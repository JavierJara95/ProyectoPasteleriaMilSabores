<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Productos | Pastelería Mil Sabores</title>

    <link rel="stylesheet" href="../assets/css/styles.css">
</head>

<body>

    <!-- encabezado y navegación -->
    <header>
        <nav>
            <a href="../index.html">Inicio</a>
            <a href="Productos.html">Productos</a>
            <a href="Carrito.html">Carrito</a>
            <a href="RegistroUsuario.html">Registrarse</a>
            <a href="IniciarSesion.html">Iniciar sesión</a>
            <a href="blogs.html">Blog</a>
            <a href="contacto.html">Contacto</a>
            <a href="nosotros.html">Nosotros</a>
        </nav>
    </header>

    <!-- contenido principal -->
    <main>

        <section class="productos-container">

            <!-- encabezado de productos -->
            <header class="productos-header">

                <h1>Nuestros productos</h1>

                <p>
                    Descubre nuestras tortas y productos de repostería
                </p>

            </header>

            <!-- filtros -->
            <section class="filtros-productos">

                <div class="form-group">

                    <label for="filtroCategoria">
                        Categoría
                    </label>

                    <select id="filtroCategoria">
                        <option value="">
                            Todas las categorías
                        </option>
                    </select>

                </div>

                <div class="form-group">

                    <label for="filtroTipo">
                        Tipo de producto
                    </label>

                    <select id="filtroTipo">
                        <option value="">
                            Todos los productos
                        </option>
                    </select>

                </div>

            </section>

            <!-- listado de productos -->
            <section
                id="contenedorProductos"
                class="productos-grid"
                aria-label="Listado de productos"
            >

                <!-- los productos serán cargados mediante JavaScript -->

            </section>

            <!-- mensaje cuando no existan productos -->
            <p
                id="mensajeProductos"
                class="mensaje-productos"
            ></p>

        </section>

    </main>

    <!-- pie de página -->
    <footer>

        <p>
            &copy; 2026 Pastelería Mil Sabores.
            Todos los derechos reservados.
        </p>

    </footer>

</body>

</html>
